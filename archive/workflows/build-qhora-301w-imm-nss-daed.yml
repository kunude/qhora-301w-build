name: Build QHora-301W (ImmortalWrt + NSS + daed)

# 第七条线（测试线）：**基座 = immortalwrt/immortalwrt** + NSS 补丁 + **daed**。
#
# ── 与第六条线（dae）的唯一区别 ────────────────────────────────
#
#   dae   = 单二进制 + 配置文件（/etc/dae/config.dae）
#           无状态、不开端口、没有数据库；界面是 luci-app-dae 的三个页面
#   daed  = dae-wing（Go 服务）+ 内嵌 Web 面板 + SQLite（/etc/daed/wing.db）
#           自己监听 HTTP，能管订阅、测节点延迟、看流量图
#
# 内核前提完全相同（BTF / cls_bpf / act_bpf / XDP），所以 configs/daed.config
# 的内核段与 dae.config 一个字不差；两者需要的 kmod 也是同一组。
#
# ── 为什么单独开一条线而不是塞进 dae 线 ────────────────────────
#   · 两者不能同时装：它们抢同一个 clsact qdisc 上的 eBPF 程序。
#   · daed 是 Go 服务 + 内嵌前端（编译时还要从 daeuniverse/daed 的 release
#     拉一份 web.zip 打进二进制），比 dae 慢，分线跑互不拖累。
#   · 这条线是**测试线**：先确认能编、能跑、面板能开，再谈并进出厂选择。
#
# ── 本线刻意不做的事 ───────────────────────────────────────────
#   · 不预置 /etc/config/daed（那是 UCI 外壳，包自带默认值就够了）；
#     真正的出厂配置是 /etc/daed/wing.db —— daed 2.x 没有配置文件，三段
#     配置和分组全在这个 SQLite 库里。它由 scripts/gen-daed-wingdb.py 在
#     构建时从 configs/daed/*.dae 编译出来，跟着覆盖层进固件。刷完机 daed
#     一起来就是配好的状态，设备上不用跑任何脚本。
#   · 不装 dae（configs/daed.config 里显式 =n，产物阶段还会反向确认）。
#   · 不带 dae 线那两个专属脚本（dae-switch / dae-geo-update）。
#
# ── 产物里会核对的硬需求 ───────────────────────────────────────
#   daed + daed-geoip/geosite + luci-app-daed + 四个 eBPF kmod + 内核 .BTF 段
#   （BTF 是 CO-RE 前提：缺了照样编得出、刷得进，但 daed 一启动就失败）
on:
  workflow_dispatch:
    inputs:
      imm_ref:
        description: "ImmortalWrt 基座的 ref（分支 / 标签 / commit，留空 = master）"
        required: false
        default: ""
      imm_feed_ref:
        description: "ImmortalWrt luci/packages 的 ref（留空 = master；一般不用填）"
        required: false
        default: ""
      imm_luci:
        description: "immortalwrt/luci 仓库地址（留空 = 官方；提供 luci-app-daed）"
        required: false
        default: ""
      imm_pkgs:
        description: "immortalwrt/packages 仓库地址（留空 = 官方）—— 只对 homeproxy 线的 sing-box 生效；本线的 daed 来自基座 feed，填了也不影响"
        required: false
        default: ""
      release:
        description: "构建成功后创建 GitHub Release 并附带镜像"
        type: boolean
        default: false
      # daed 版本：留空 = 2.1.1 的**官方预编译二进制**（aarch64 静态，内含前端）。
      # 填 latest = 跟随上游最新 release；填 2.1.0 之类 = 钉死。
      # 为什么是预编译：daed 2.x 不再发布 web.zip，前端要 pnpm 现编，构建树里没有 node。
      daed_version:
        description: "daed 版本，如 2.1.1（留空 = 默认 2.1.1 预编译；填 latest = 跟随上游最新 release）"
        required: false
        default: ""
      # 下面两个留空就跟随上游最新版本（默认行为）。
      # 想编某个确定版本、或者要可复现的固件时，在这里填死。
      ddns_go_version:
        description: "钉死 ddns-go 版本，如 6.17.7（留空 = 跟随上游最新 release）"
        required: false
        default: ""
      msd_lite_sha:
        description: "钉死 msd_lite 的 commit sha（留空 = 跟随上游 master HEAD）"
        required: false
        default: ""
      # 勾选后**不恢复任何构建缓存**（dl 源码包 + ccache），完全从零编译。
      # 只影响本次运行：跑完仍会保存新的源码包缓存供下次复用。
      clean_build:
        description: "从头编译：忽略 dl 与 ccache 缓存"
        type: boolean
        default: false
  push:
    branches: [main]
    # 只监听"只属于本线"的文件。
    # 监听 scripts/ patches/ 会让它与 imm-nss 线同时触发全量编译。
    paths:
      - ".github/workflows/build-qhora-301w-imm-nss-daed.yml"
      - "configs/daed.config"
      - "configs/imm-nss.config"
      # 这两个脚本**只属于本线**，改它们就该重跑：
      #   resolve-daed-version.sh 决定编哪版、daed-prebuilt.mk 是配方模板。
      - "scripts/resolve-daed-version.sh"
      - "scripts/daed-prebuilt.mk"
      # ⚠️ 其余 scripts/**（prepare-build.sh、extra-packages.sh 等）故意**不**监听：
      #    它们是五条线共用的，一改就会让所有线一起进全量编译。
      #    改了共用脚本，手动 Run workflow 即可。
  # 故意**没有** schedule：这是测试线，先手动跑通再说。
  # 等 daed 能稳定编出来、面板确认可用之后，再把 dae 线那条
  # `- cron: "0 22 * * 0"` 挪过来（两条 cron 要错开，别撞 concurrency）。

# 用**独立**的 concurrency group。共用一个 group 时，另一条线的 run 会让本线
# 新进来的 run 被 GitHub 直接判成 cancelled（老 homeproxy 线撞过这个坑）。
concurrency:
  group: build-qhora-301w-imm-nss-daed-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ── 基座源码：活的 ImmortalWrt ──────────────────────────────
  IMM_REPOSITORY: immortalwrt/immortalwrt
  # 基座的 ref。**与下面的 IMM_REF 是两个不同的东西**：
  #   IMM_BASE_REF = immortalwrt/immortalwrt 这个仓库的 ref（checkout 基座用）
  #   IMM_REF      = immortalwrt/luci 与 immortalwrt/packages 的 ref
  #                  （extra-packages.sh 稀疏检出 HomeProxy / sing-box 用）
  # 两者拆开是必要的：它们分属三个不同的仓库，把 imm_ref 钉到某个基座 commit
  # 时，那个 commit 在 luci/packages 里根本不存在，稀疏检出会直接失败。
  # 本线用 IMM_REF 的地方只剩 luci（ddns-go / msd_lite / luci-base / luci-mod-status
  # 四个前端），daed 与 luci-app-daed 直接由 feeds 提供。
  # ⚠️ 暂时钉在 da63f7d（2026-10-15，NSS 补丁完整编译验证过的那一版）。
  # 原因：immortalwrt 的 2248ed7（2026-10-16 "nftables: refresh patches after
  # version bump"）动了内核模块定义，patches/immortalwrt-nss/ 这份补丁的
  # 上下文对不上（input.mk / usb.mk / ipq8074-rt-ax89x.dts / qca_ppe_main.c
  # 四处），`git apply` 与 `patch --fuzz=3` 都拒绝 —— 2026-10-19 的 CI 就卡在这里。
  # 补丁按新基座重新生成之后，把这里改回 'master' 即可（手动触发时用
  # imm_ref 输入可以临时覆盖）。
  IMM_BASE_REF: ${{ github.event.inputs.imm_ref || 'da63f7d6ac4207e534c9b92ba3d2b555a8edce8d' }}
  # 用 github.event.inputs 而不是 inputs：两者在 workflow_dispatch 下等价，
  # 但前者在 push / schedule 事件下也能安全求值（返回空）。
  IMM_REF: ${{ github.event.inputs.imm_feed_ref || 'master' }}
  IMM_LUCI: ${{ github.event.inputs.imm_luci }}
  IMM_PKGS: ${{ github.event.inputs.imm_pkgs }}
  # NSS 驱动 / ECM / qdisc / 固件所在的独立 feed —— 与另外三条线**同一个**。
  # feed 是独立的包仓库，与"换不换基座"无关，所以这里一个字都不用改。
  # 缺了它 ATH11K_NSS_SUPPORT 的依赖不满足，连 defconfig 都会失败。
  NSS_FEED: "src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;edma-nss"

  # ── 目标机型 ────────────────────────────────────────────────
  TARGET: qualcommax
  SUBTARGET: ipq807x
  DEVICE: qnap_301w
  DEVICE_LABEL: QHora-301W
  OPENWRT_DIR: ${{ github.workspace }}/openwrt
  BUILDER_DIR: ${{ github.workspace }}/builder

  # ── 代理栈 ──────────────────────────────────────────────────
  # daed：多拼一份 configs/daed.config —— 它做两件事：
  #   ① 把 common.config 的 passwall2 全家按掉（与 homeproxy.config 同一套 =n）；
  #   ② 打开 daed + 它依赖的 kmod + 三个内核符号（BTF / BPF_EVENTS / XDP_SOCKETS）。
  # daed 本体在 feeds/packages/net/daed，luci-app-daed 在 feeds/luci/applications，
  # 都是基座自带 feed ⇒ extra-packages.sh 的 daed 分支**一个仓库都不拉**。
  # 注意这里没有 SINGBOX_MODE：那个变量只对 PROXY_STACK=homeproxy 有意义
  # （extra-packages.sh 里有一条守卫会直接拒绝其它组合）。
  PROXY_STACK: daed

jobs:
  build:
    name: Build ImmortalWrt@${{ github.event.inputs.imm_ref || 'master' }} -> QHora-301W (NSS + daed)
    # 与上游作者自己的 CI 同一档环境，避免踩 base image 的坑。
    runs-on: ubuntu-26.04
    # GitHub 托管 runner 单个 job 硬上限 6 小时，这里留 5 分钟收尾。
    timeout-minutes: 355
    permissions:
      # 勾选 release 时需要有写权限。仓库设置里
      # Settings -> Actions -> General -> Workflow permissions 需要允许读写。
      contents: write

    steps:
      # ── 释放磁盘 ──────────────────────────────────────────────
      # 全量编译（工具链 + 内核 + 全部软件包）大约需要 25-35GB，
      # runner 根分区默认不够，先删掉用不到的预装 SDK。
      - name: 释放磁盘空间
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h / | tail -1

      # ── 系统依赖 ──────────────────────────────────────────────
      - name: 安装构建依赖
        run: |
          set -euo pipefail
          # OpenWrt 自建 flex/bison 等 host 工具，所以宿主机只需要最小集合。
          # 这个列表与上游 Qualcommax_NSS_Builder 的 CI 保持一致，是验证过的组合。
          # 不需要 rsync —— prepare-build.sh 叠加覆盖文件用的是 cp -a。
          # patch    NSS 补丁的兜底应用方式（git apply 失败时用）。
          # python3  extra-packages.sh 的 latest 通道要它打 HomeProxy 兼容补丁；
          #          runner 预装了，这里显式声明，免得换了 base image 才炸。
          sudo apt-get update || true
          sudo apt-get install -y \
            bzip2 g++ gawk gcc git glibc-source libncurses-dev make patch python3

      # ── 拉取源码 ──────────────────────────────────────────────
      # fetch-depth 1：本线的补丁应用不依赖历史（用 git apply / patch -p1，
      # 不做三方合并），浅克隆足够，还能省掉一大截下载时间。
      - name: 检出 ImmortalWrt 基座源码
        uses: actions/checkout@v7
        with:
          repository: ${{ env.IMM_REPOSITORY }}
          ref: ${{ env.IMM_BASE_REF }}
          fetch-depth: 1
          path: openwrt

      - name: 检出本仓库（配置与脚本）
        uses: actions/checkout@v7
        with:
          path: builder

      # ── 组装构建环境 ──────────────────────────────────────────
      # 先确认 runner 上真有 feeds/make 依赖的工具：scripts/feeds 是 Perl 脚本、
      # 索引器要 make，缺任何一项都会在后面以很晦涩的方式失败。
      - name: 环境预检
        run: |
          set -euo pipefail
          # scripts/feeds 是 Perl 脚本、索引器要 make；
          # resolve-versions.sh 还要 curl/tar/sha256sum 去解析上游版本并算 hash；
          # apply-nss-patches.sh 需要 patch 做兜底应用。
          # 缺任何一项都会在后面以很晦涩的方式失败，所以先查一遍。
          for c in perl make git gcc g++ gawk bzip2 curl tar sha256sum patch python3; do
            command -v "$c" >/dev/null 2>&1 ||
              { echo "::error::runner 上缺少必需工具：$c"; exit 1; }
          done
          perl -v | sed -n '2p'
          make --version | head -1
          echo "必需工具齐备"

      # ── NSS 移植 + 准备构建环境 ───────────────────────────────
      # 第 0 步（imm 线独有）：apply-nss-patches.sh 把 NSS 补丁打进 immortalwrt 源码树；
      # 第 1–7 步与另外三条线完全相同（feeds / 第三方包 / .config / 符号校验 /
      # 凭据守卫 / 覆盖文件 / 内核补丁注入），只是 PROXY_STACK=daed。
      - name: NSS 移植 + 准备构建环境（feeds + daed + .config + 覆盖文件）
        env:
          # 用来查 GitHub API 解析 ddns-go / msd_lite 的上游最新版本。
          # 不给 token 也能跑，但未认证限额只有 60 次/小时，容易被别处撞掉。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 留空 = 跟随上游最新版本（默认）。push / schedule 事件下这两个表达式
          # 求值为空字符串，所以那两个触发方式天然就是"跟随最新"。
          DDNS_GO_VERSION: ${{ github.event.inputs.ddns_go_version }}
          MSD_LITE_SHA: ${{ github.event.inputs.msd_lite_sha }}
          # daed 版本：留空 = 2.1.1 预编译；resolve-daed-version.sh 会重渲染 feed 配方
          # （feed 自带的是 1.27.0 源码版，且 2.x 源码在 OpenWrt 里编不出前端）。
          DAED_VERSION: ${{ github.event.inputs.daed_version }}
          # 本线只用 immortalwrt/luci 那四个前端（ddns-go / msd_lite /
          # luci-base / luci-mod-status）；daed 与 luci-app-daed 由 feeds 直供。
          # 全部留空 = 用 extra-packages.sh 的默认值。
          IMM_REF: ${{ github.event.inputs.imm_feed_ref || 'master' }}
          IMM_LUCI: ${{ github.event.inputs.imm_luci }}
          IMM_PKGS: ${{ github.event.inputs.imm_pkgs }}
        run: bash "$BUILDER_DIR/scripts/prepare-build-imm-nss.sh"

      # 日志要仓库 admin 权限才能从 API 下载，所以把它回放到控制台，
      # 失败时这一步也会执行（always），日志一定看得到。
      - name: 回放构建准备日志
        if: always()
        run: |
          f="$GITHUB_WORKSPACE/prepare-build.log"
          if [ -f "$f" ]; then
            echo "::group::prepare-build.sh 日志（尾部 150 行）"
            tail -n 150 "$f"
            echo "::endgroup::"
          else
            echo "没有生成 prepare-build.log（可能是 NSS 补丁那一步就失败了，见上一步输出）"
          fi

      # ── 可复现构建 ────────────────────────────────────────────
      # 注意：下面两个 KBUILD_BUILD_* 只对**非内核**组件生效。内核版本串里的
      # user@host 由 include/kernel.mk 以 make 变量覆盖环境变量，必须写在
      # configs/common.config 的 CONFIG_KERNEL_BUILD_USER / _DOMAIN 里。
      - name: 设置可复现构建环境变量
        working-directory: openwrt
        run: |
          set -euo pipefail
          git log -1 --format='  base commit : %H %ci%n  subject     : %s'
          {
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
            echo "TZ=UTC"
            echo "LC_ALL=C"
            echo "KBUILD_BUILD_USER=builder"
            echo "KBUILD_BUILD_HOST=github-actions"
          } >>"$GITHUB_ENV"

      # ── 下载源码包 ────────────────────────────────────────────
      # 上游镜像偶尔抽风，重试三次。下载好的包在多次运行之间缓存复用。
      # cache key 带 imm-daed- 前缀：不与另外几条线的 dl 缓存互相顶掉
      # （各线的包集合不同）。
      - name: 恢复源码包缓存
        if: github.event.inputs.clean_build != 'true'
        uses: actions/cache/restore@v6
        with:
          path: openwrt/dl
          # 带上 run_attempt：整个 run 重跑时不会撞上已存在的 key
          key: dl-imm-daed-${{ github.run_id }}-${{ github.run_attempt }}
          # 退一步也可以复用 imm-nss 线的 dl（基座与 NSS 部分完全相同，
          # 只差 daed 那几个包的源码包）
          restore-keys: |
            dl-imm-daed-
            dl-imm-

      - name: 下载源码包
        id: download
        working-directory: openwrt
        run: |
          set -euo pipefail
          mkdir -p dl
          before=$(find dl -maxdepth 1 -type f | wc -l)
          for attempt in 1 2 3; do
            if make download -j"$(nproc)"; then break; fi
            if [[ $attempt -ge 3 ]]; then echo "::error::源码包下载连续失败三次"; exit 1; fi
            echo "::warning::第 $attempt 次下载失败，重试"
            sleep 10
          done
          if [[ "$(find dl -maxdepth 1 -type f | wc -l)" -gt "$before" ]]; then
            echo "grew=true" >>"$GITHUB_OUTPUT"
          else
            echo "grew=false" >>"$GITHUB_OUTPUT"
          fi

      - name: 保存源码包缓存
        if: steps.download.outputs.grew == 'true'
        # 缓存只是加速手段，存不进去（配额满、key 冲突）不该让整个构建失败
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: openwrt/dl
          key: dl-imm-daed-${{ github.run_id }}-${{ github.run_attempt }}

      # ── ccache ────────────────────────────────────────────────
      # 缓存 key 里带上工具链目录树的哈希和 binutils/gcc/libc 的配置：
      # 任何一项变了都从空缓存开始，避免命中错误的目标文件。
      # 前缀带 imm-daed-：与另外几条线的 ccache 分开，各线的宏/补丁集不同，
      # 混用只会浪费容量。
      - name: 计算 ccache key
        id: ccache
        run: |
          set -euo pipefail
          tree=$(git -C openwrt rev-parse HEAD:toolchain)
          sum=$({
            echo "$tree"
            grep -E '^CONFIG_(BINUTILS|GCC|LIBC|MUSL|GLIBC)_' openwrt/.config
            gcc --version; as --version
          } | sha256sum | cut -c1-16)
          echo "prefix=ccache-qhora301w-imm-daed-$sum-" >>"$GITHUB_OUTPUT"

      - name: 恢复 ccache
        if: github.event.inputs.clean_build != 'true'
        uses: actions/cache@v6
        with:
          path: openwrt/.ccache
          key: ${{ steps.ccache.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.ccache.outputs.prefix }}

      # ── 编译 ──────────────────────────────────────────────────
      # 首次运行没有缓存会慢很多；如果撞到 6 小时上限，直接重跑一次，
      # ccache 和 dl 缓存都会复用。
      - name: 编译
        working-directory: openwrt
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 5G
          # 构建日志留给下面两步做回放和注解上报。
          # 放 RUNNER_TEMP 而不是工作区，免得混进 artifact 或被 git 看到。
          BUILD_LOG: ${{ runner.temp }}/build.log
        run: |
          # 这里**故意不加 -e**：make 失败要自己接住，好决定是否单线程重跑，
          # 并把完整日志留下来给后面两步上报。
          set -uo pipefail
          : >"$BUILD_LOG"

          # 走 tee 之后 $? 是 tee 的退出码，make 自己的要用 PIPESTATUS[0] 取。
          make -j"$(nproc)" 2>&1 | tee -a "$BUILD_LOG"
          rc=${PIPESTATUS[0]}

          if (( rc != 0 )); then
            echo "::warning::并行编译失败（make 退出码 $rc），改用单线程 -j1 V=s 重跑以拿到完整报错"
            make -j1 V=s 2>&1 | tee -a "$BUILD_LOG"
            rc=${PIPESTATUS[0]}
          fi

          staging_dir/host/bin/ccache -s 2>&1 | tee -a "$BUILD_LOG" || true

          if (( rc != 0 )); then
            echo "编译失败：make 最终退出码 $rc。完整日志见下一步「回放编译日志」。"
            exit "$rc"
          fi
          echo "编译通过"

      # 编译**失败**的唯一远程可见通道是注解：作业日志要仓库 admin 权限才能从
      # API 下载（公开仓库一样 403），而 ::error:: 会变成 check-run annotation，
      # 那个是公开可读的。所以把"哪个包挂了 / 报错行"发成注解。
      - name: 回放编译日志
        if: always()
        env:
          BUILD_LOG: ${{ runner.temp }}/build.log
        run: |
          if [[ ! -s "$BUILD_LOG" ]]; then
            echo "没有构建日志（可能编译步骤之前就失败了）"
            exit 0
          fi
          echo "::group::构建日志共 $(wc -l <"$BUILD_LOG") 行，回放最后 250 行"
          tail -n 250 "$BUILD_LOG"
          echo "::endgroup::"

      - name: 上报编译失败原因
        if: failure()
        env:
          BUILD_LOG: ${{ runner.temp }}/build.log
        run: |
          [[ -s "$BUILD_LOG" ]] || exit 0

          # OpenWrt 挂在某个包上时会打印固定格式： "ERROR: package/<路径> failed to build."
          failed=$(grep -oE 'ERROR: package/[^ ]+ failed to build' "$BUILD_LOG" \
                   | sed 's|^ERROR: package/||; s| failed to build$||' \
                   | sort -u | tr '\n' ' ' || true)
          # 最常见的几种真实报错行（尾部若干条，前面的多半是噪音）
          hints=$(grep -nE 'Error [0-9]+$|error:|Error [0-9]+:|undefined reference|cannot find -l|No rule to make target|fatal error|CMake Error' \
                  "$BUILD_LOG" | tail -n 8 || true)

          if [[ -n "$failed" ]]; then
            echo "::error title=编译失败的包::${failed}"
          fi
          if [[ -n "$hints" ]]; then
            # 注解里的换行要写成 %0A，而 % 本身必须写成 %25（否则会被当转义前缀）
            msg=$(printf '%s\n' "$hints" | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=编译报错行（尾部 8 条）::${msg}"
          fi
          if [[ -z "$failed$hints" ]]; then
            echo "::error title=编译失败::没从日志里认出固定格式的报错，请看上一步的控制台回放"
          fi

      # ── 收集产物 ──────────────────────────────────────────────
      - name: 收集并校验产物
        run: |
          set -euo pipefail
          out="openwrt/bin/targets/${TARGET}/${SUBTARGET}"
          [[ -d "$out" ]] || { echo "::error::输出目录不存在：$out"; exit 1; }

          ls -lh "$out"

          # 必须有 sysupgrade；没有就说明设备压根没编进去。
          compgen -G "$out/*${DEVICE}*squashfs-sysupgrade.bin" >/dev/null ||
            { echo "::error::$out 下没有 ${DEVICE} 的 sysupgrade 镜像"; exit 1; }

          # 把产物清单也发成注解：check-run annotations 是公开可读的，
          # 而作业日志和 artifact 内容都必须登录才能看 —— 这样远程（包括无人值守
          # 的自动化脚本）也能核对到底编出了哪些镜像、各多大。
          # 整段包在 if 里，避免 set -e 把「grep 没匹配到」当成失败。
          # 注意 grep 的模式里要有 .manifest：rootfs 清单的文件名是
          # openwrt-<board>-<subtarget>[-profile].manifest，不一定含设备名。
          if listing=$(cd "$out" && ls -lh . 2>/dev/null |
                         grep -E "${DEVICE}|sha256sums|config\.buildinfo|profiles\.json|\.manifest|\.bom\.cdx\.json" |
                         awk '{print $5"  "$9}'); then
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              echo "::notice title=QHora-301W 产物::$line"
            done <<<"$listing"
          fi

          {
            echo "## QHora-301W 构建产物（ImmortalWrt + NSS + daed）"
            echo
            echo '```'
            (cd "$out" && ls -lh . | grep -E "${DEVICE}|sha256sums|config\.buildinfo|profiles\.json|\.manifest" || true)
            echo '```'
            echo
            echo "- 基座：\`${IMM_REPOSITORY}@${IMM_BASE_REF}\`，提交 \`$(git -C openwrt rev-parse --short HEAD)\`"
            echo "- NSS 补丁集：\`patches/immortalwrt-nss/\`（来源见该目录 README.md）"
            echo "- 代理栈：daed（\`daed\` + \`luci-app-daed\`，eBPF 内核态分流；内核已开 BTF）"
            if [[ -f "$out/config.buildinfo" ]]; then
              echo "- NSS 固件档位：\`$(grep -m1 '^CONFIG_NSS_FIRMWARE_VERSION' "$out/config.buildinfo" || true)\`"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      # ── 校验功能包真的进了固件 ────────────────────────────────
      # 配置里写 CONFIG_PACKAGE_x=y 只证明"被选中"，不证明"编出来了"。
      # 这里从三个互相独立的角度核对：
      #   ① 包文件（apk 后端是 .apk，opkg 后端是 .ipk）；
      #   ② rootfs 的 .manifest —— 最终固件的包清单；
      #   ③ 内核 vmlinux 的 .BTF 段 —— daed 的 CO-RE 前提。这一条最容易被忽略：
      #      .config 里写了 =y 也可能被 KERNEL_DEBUG_INFO_REDUCED 挡掉，
      #      编出来的内核照样没有 BTF，固件刷进去 daed 一启动就失败。
      - name: 校验功能包是否真的编进固件
        run: |
          set -euo pipefail
          out="openwrt/bin/targets/${TARGET}/${SUBTARGET}"

          # NSS 那一组是这条线存在的理由，列在最前面。
          # nss-tools 提供 /usr/sbin/nss-up、nss-status 与 'nss' 开机服务；
          # luci-app-nss / luci-app-nssqos 是配套页面；nssqos 是 DSCP 标记。
          # 缺任何一个都说明补丁集没生效。
          NSS_WANT="nss-tools luci-app-nss nssqos luci-app-nssqos \
                    kmod-qca-nss-drv kmod-qca-nss-ecm kmod-qca-ppe-nss \
                    kmod-qca-nss-drv-pppoe kmod-qca-nss-drv-bridge-mgr"

          # daed 那一组，逐个都是"缺了就起不来 / 分流不完整"的硬需求：
          #   daed                      主程序（eBPF 对象编进二进制里）
          #   luci-app-daed             设置 / 配置编辑 / 日志三个页面
          #   daed-geoip / daed-geosite  把 v2ray 的 geo 数据软链到 /usr/share/daed/
          #   v2ray-geoip / geosite    真正的数据文件（上面两个包的 DEPENDS）
          #   kmod-sched-core          sch_ingress（clsact qdisc —— daed 挂程序的地方）
          #   kmod-sched-bpf           cls_bpf + act_bpf（内核侧分流动作）
          #   kmod-veth                daed 配方 DEPENDS 里点名
          #   kmod-xdp-sockets-diag    DEPENDS 是 @KERNEL_XDP_SOCKETS，符号没开就不会被编
          #
          # 这里**故意没有** sing-box / homeproxy / kmod-nft-tproxy / dnsmasq-full：
          # daed 不走 TPROXY、不生成 sing-box 配置、不劫持 dnsmasq，那几个都用不上。
          WANT="msd_lite luci-app-msd_lite luci-i18n-msd_lite-zh-cn \
                ddns-go luci-app-ddns-go luci-i18n-ddns-go-zh-cn \
                wireguard-tools luci-proto-wireguard kmod-wireguard \
                daed luci-app-daed luci-i18n-daed-zh-cn \
                daed-geoip daed-geosite v2ray-geoip v2ray-geosite \
                kmod-sched-core kmod-sched-bpf kmod-veth kmod-xdp-sockets-diag \
                luci-app-statistics luci-i18n-statistics-zh-cn \
                collectd-mod-thermal rrdtool1 autocore"

          # ── ① 先搞清楚这个分支用的是 apk 还是 opkg ─────────────────
          backend=$(grep -m1 -E '^CONFIG_USE_APK=' openwrt/.config 2>/dev/null || true)
          apk_n=$(find openwrt/bin/packages -maxdepth 3 -name '*.apk' 2>/dev/null | wc -l || true)
          ipk_n=$(find openwrt/bin/packages -maxdepth 3 -name '*.ipk' 2>/dev/null | wc -l || true)
          echo "::notice title=包后端::${backend:-（.config 里没有 CONFIG_USE_APK，按默认 =y 走 apk）}；bin/packages 下 .apk=$apk_n 个 / .ipk=$ipk_n 个"

          # ── ② rootfs 清单 ──────────────────────────────────────────
          manifest=$(find "$out" -maxdepth 1 -name '*.manifest' -print -quit 2>/dev/null || true)
          if [[ -n "$manifest" ]]; then
            echo "::notice title=rootfs 清单::$(basename "$manifest") —— $(wc -l < "$manifest") 行"
          else
            echo "::warning::$out 下没有 .manifest，只能核对包文件"
          fi

          bad=0
          for p in $NSS_WANT $WANT; do
            pkg=$(find openwrt/bin/packages openwrt/bin/targets \
                    \( -name "${p}-*.apk" -o -name "${p}_*.ipk" \) \
                    -print -quit 2>/dev/null || true)

            hit=0
            if [[ -n "$manifest" ]] && grep -qE "^${p}[[:space:]]" "$manifest"; then hit=1; fi

            if [[ -n "$pkg" && "$hit" -eq 1 ]]; then
              echo "::notice title=功能包 OK::$p → $(basename "$pkg")，已在 rootfs 清单里"
            elif [[ -n "$pkg" ]]; then
              echo "::warning::$p 编出来了（$(basename "$pkg")）但不在 rootfs 清单里"
            elif [[ "$hit" -eq 1 ]]; then
              echo "::error::$p 在 rootfs 清单里，却找不到它的包文件"
              bad=$((bad + 1))
            else
              echo "::error::$p 既没有包文件也不在 rootfs 清单里 —— 它没有被编译"
              bad=$((bad + 1))
            fi
          done

          [[ "$bad" -eq 0 ]] || { echo "::error::有 $bad 个要求的功能包没有被编译"; exit 1; }
          echo "要求的功能包全部已编译并进入 rootfs"

          # ── ③ 内核 BTF：daed 的 CO-RE 硬前提 ────────────────────────
          # 只看 .config 不够。这里直接验产物：vmlinux 里必须真的存在 .BTF 段，
          # 而且不能是个空壳（本内核实测 3.7MB，>1MB 是个安全下限）。
          #
          # 两个坑（本地实测踩过，别改回去）：
          #  ① vmlinux 的路径必须精确。build_dir 底下还有
          #     bpf-headers/*/tools/perf/util/bpf_skel/vmlinux 这种 4KB 的
          #     假 vmlinux（perf 的 skeleton 用的），用 `find -name vmlinux
          #     -print -quit` 会先撞上它，然后永远报"没有 .BTF 段"。
          #     真正的那个在 build_dir/target-*/linux-qualcommax_*/linux-*/ 下。
          #  ② 不能用 host 的 objcopy。linux-6.18.55/vmlinux 是 aarch64 ELF，
          #     runner 上的 x86_64 binutils 直接报
          #         objcopy: Unable to recognise the architecture of the input file
          #     ⇒ 以一个非 0 返回码失败，被当成"没有 BTF"。
          #     readelf 是 arch-agnostic 的，解析的是段表本身，所以改用 readelf。
          btfi=$(grep -m1 '^CONFIG_KERNEL_DEBUG_INFO_BTF=' openwrt/.config || true)
          red=$(grep -m1 '^CONFIG_KERNEL_DEBUG_INFO_REDUCED=' openwrt/.config || true)
          echo "::notice title=内核 BTF 配置::${btfi:-（未设置）} / ${red:-（未设置）}"

          vmlinux=$(ls -1 openwrt/build_dir/target-*/linux-qualcommax_*/linux-*/vmlinux 2>/dev/null | head -1)
          [[ -n "$vmlinux" ]] || { echo "::error::找不到 vmlinux（build_dir/target-*/linux-qualcommax_*/linux-*/），无法核对 BTF"; exit 1; }
          echo "::notice title=vmlinux::$(stat -c %s "$vmlinux") 字节"

          # 段表里 .BTF 那一行的 Size 列（hex）。awk 里按字段位置取：
          #   [11]  .BTF  PROGBITS  Address  Offset  Size  ...
          # 注意 [ 1] 这种一位数编号会把字段错开，所以不能用 $2==".BTF"，
          # 得遍历所有字段找精确等于 .BTF 的那个（顺带排除 .BTF_ids / .BTF.ext）。
          btf_hex=$(readelf -S -W "$vmlinux" 2>/dev/null \
            | awk '{for(i=1;i<=NF;i++) if($i==".BTF"){print $(i+4); exit}}' || true)
          if [[ -n "$btf_hex" ]]; then
            btf_size=$((16#$btf_hex))
          else
            btf_size=0
          fi
          echo "::notice title=vmlinux .BTF 段::${btf_size} 字节"
          if [[ "${btf_size:-0}" -lt 1048576 ]]; then
            echo "::error::vmlinux 里没有可用的 .BTF 段（${btf_size} 字节）—— daed 加载 eBPF 时会失败"
            echo "::error::查 configs/daed.config 的 CONFIG_KERNEL_DEBUG_INFO_BTF / _DEBUG_INFO_REDUCED"
            echo "::error::（REDUCED 必须是 n：BTF 的 Kconfig 依赖是 depends on !KERNEL_DEBUG_INFO_REDUCED）"
            exit 1
          fi
          echo "::notice title=BTF 就绪::内核带 ${btf_size} 字节 BTF，daed 的 CO-RE 前提成立"

          # ── ④ rootfs 里真的有 daed 那一套 ─────────────────────────
          # 这里核对两类文件：① 包自己装进去的（主程序、UCI 配置、init、
          # geo 软链、LuCI 菜单与 ACL）；② files-daed/ 覆盖层带来的出厂
          # 配置 /etc/daed/wing.db（构建时编译出来的那一段）。
          # 少任何一个都说明 daed 没装对、或者覆盖层没叠上。
          #
          # 注意 host 工具名叫 **unsquashfs4**（不是 unsquashfs）——
          # OpenWrt 的 squashfs-tools 配方产出的二进制带 4 后缀，
          # `find staging_dir -name unsquashfs` 是找不到的（本地实测踩过）。
          unsq=$(find openwrt/staging_dir/host/bin -maxdepth 1 -name 'unsquashfs*' -perm -u+x -print -quit 2>/dev/null || true)
          if [[ -z "$unsq" ]]; then
            unsq=$(command -v unsquashfs 2>/dev/null || true)
          fi
          if [[ -z "$unsq" ]]; then
            echo "::warning::既没有 host 版 unsquashfs4 也没有系统 unsquashfs，跳过出厂文件核对"
          else
            echo "::notice title=解包工具::$unsq"
            tmpd=$(mktemp -d)
            sysup=$(find "$out" -name "*${DEVICE}*squashfs-sysupgrade.bin" -print -quit)
            [[ -n "$sysup" ]] || { echo "::error::找不到 sysupgrade 镜像，无法核对出厂文件"; exit 1; }
            tar -xf "$sysup" -C "$tmpd"
            # sysupgrade tar 里的布局**不一定**是根目录平铺：
            # 新版是 sysupgrade-qnap_301w/{CONTROL,root,kernel}，
            # 老版直接是 CONTROL/root/kernel。所以不能写死 "$tmpd/root"，
            # 得先找出来（否则 unsquashfs 只会说一句
            # "Could not open .../root, because No such file or directory"，
            # 然后所有出厂文件都报缺失 —— 本地实测踩过）。
            sqroot=$(find "$tmpd" -maxdepth 2 -name root -type f -print -quit)
            [[ -n "$sqroot" ]] || { echo "::error::sysupgrade tar 里找不到 squashfs 的 root 分区镜像"; exit 1; }
            echo "::notice title=squashfs 镜像::$(basename "$(dirname "$sqroot")")/root"
            # unsquashfs 在非 root 下建不了 /dev/console 节点，会返回非 0，
            # 但文件已经解出来了 —— 所以别用返回值判断成败，直接查文件。
            "$unsq" -q -d "$tmpd/rootfs" "$sqroot" >/dev/null 2>&1 || true
            nf=$(find "$tmpd/rootfs" 2>/dev/null | wc -l)
            if [[ "$nf" -lt 100 ]]; then
              echo "::error::rootfs 只解出 ${nf} 个文件 —— unsquashfs 没能解开镜像（工具版本不匹配？）"
              exit 1
            fi
            echo "::notice title=rootfs::解开 ${nf} 个文件"
            for f in usr/bin/daed etc/config/daed etc/init.d/daed \
                     usr/share/daed/geoip.dat usr/share/daed/geosite.dat \
                     usr/share/luci/menu.d/luci-app-daed.json \
                     usr/share/rpcd/acl.d/luci-app-daed.json \
                     etc/ssh/sshd_config \
                     etc/daed/wing.db; do
              # geoip.dat / geosite.dat 是软链（daed-geoip -> ../v2ray/...），
              # 用 -e 会跟随软链判断，软链断了就误报，所以 -L 也算存在
              if [[ -e "$tmpd/rootfs/$f" || -L "$tmpd/rootfs/$f" ]]; then
                echo "::notice title=出厂文件::/$f 已在 rootfs 中"
              else
                echo "::error::rootfs 里缺少 /$f —— files-dae 覆盖层没生效？"
                bad=$((bad + 1))
              fi
            done
            # 97/98 那两个 uci-defaults 是 dae 线专属（SSH 修复 / config.dae
            # 权限），daed 线不带，这里也不查。
            #
            # wing.db 是**出厂配置本体**，必须打进固件：daed 2.x 没有配置文件，
            # global / dns / routing / 分组全在这个 SQLite 库里。上一段只核对了
            # 文件存在（压坏的空壳也能过），这里用构建期同一个脚本验内容。
            # 路径必须走 $BUILDER_DIR：本仓库是 checkout 到 builder/ 子目录的，
            # 默认工作目录是 workspace 根，写 `scripts/...` 会 No such file or directory
            # （2026-10-25 就是这么挂的：产镜像没问题，最后一步校验挂掉）。
            wingdb="$tmpd/rootfs/etc/daed/wing.db"
            if [[ -f "$wingdb" ]]; then
              if python3 "$BUILDER_DIR/scripts/check-daed-wingdb.py" "$wingdb"; then
                echo "::notice title=daed 出厂配置::wing.db 就位（三段配置 selected + proxy 组 + 1 个管理员）"
              else
                echo "::error::固件里的 wing.db 内容不对（上面每行 [x] 都是具体判据）"
                bad=$((bad + 1))
              fi
              # 里面有管理员口令哈希：镜像里若 world-readable，拿到固件的人
              # 就能直接拿走哈希去爆破。
              perm=$(stat -c '%a' "$wingdb" 2>/dev/null || stat -f '%Lp' "$wingdb" 2>/dev/null || echo '?')
              echo "::notice title=wing.db 权限::$perm"
            fi
            # daed 的配置是 UCI（/etc/config/daed）+ 运行期数据库，没有 config.daed，
            # 所以没有 0600 权限那个坑。这里只确认配置文件在（包自带默认值）。
            if [[ -f "$tmpd/rootfs/etc/config/daed" ]]; then
              echo "::notice title=daed 配置::/etc/config/daed 在（$(wc -c < "$tmpd/rootfs/etc/config/daed") 字节）"
            else
              echo "::error::rootfs 里没有 /etc/config/daed —— daed 包没有正确安装"
              bad=$((bad + 1))
            fi
            # 预编译版必须真的是那个版本：解析出 2.1.1、装进去却是别的（dl 里留着旧包）
            # 这种不一致只看日志查不出来，直接从二进制里找版本串。
            if [[ -f openwrt/.daed-resolved ]]; then
              dver=$(sed -n 's/^ver=//p' openwrt/.daed-resolved | head -1)
              if [[ -z "$dver" ]]; then
                echo "::warning::openwrt/.daed-resolved 里没有 ver=，跳过 daed 版本核对"
              elif strings -a "$tmpd/rootfs/usr/bin/daed" 2>/dev/null | grep -qx "v${dver}"; then
                echo "::notice title=daed 版本::产物里是 v${dver}（与本次渲染一致）"
              else
                echo "::error::产物里的 daed 不是 v${dver} —— 检查 dl/ 里的 zip 是否是本次下载的那份"
                bad=$((bad + 1))
              fi
            fi
            # 反向确认：这条线不该带 dae / sing-box / homeproxy / passwall2。
            # 判据用 **manifest（已安装包清单）**，不查 /etc/config/：
            # 构建树被复用时会留下上一次构建的孤儿配置文件（本地实测：一棵
            # 以前编过 passwall2/homeproxy 的树上，rootfs 里会残留这两个
            # /etc/config 文件，但它们不在任何 .list 里、也不在 manifest 里）。
            # CI 每次都是全新的树，但用 manifest 判定在任何树上都准确。
            man=$(ls -1 "$out"/*.manifest 2>/dev/null | head -1)
            if [[ -z "$man" ]]; then
              echo "::error::找不到 *.manifest，无法确认已安装包清单"
              bad=$((bad + 1))
            else
              # ⚠️ 正则里写的是 dae（单数），不是 daed —— daed 是本线的主角。
              # `^(dae|...)([[:space:]]|$)` 不会误伤 "daed 1.27.0"（后面跟的是 d）。
              if grep -qE '^(dae|luci-app-dae|sing-box|luci-app-homeproxy|homeproxy|luci-app-passwall2|passwall2)([[:space:]]|$)' "$man"; then
                echo "::error::manifest 里还有 dae / sing-box / homeproxy / passwall2 —— 代理栈没换干净（daed.config 的 =n 没生效？）"
                grep -nE '^(dae|luci-app-dae|sing-box|luci-app-homeproxy|luci-app-passwall2)' "$man" | sed 's/^/  /'
                bad=$((bad + 1))
              else
                echo "::notice title=已安装包::manifest 里没有 dae / sing-box / homeproxy / passwall2"
              fi
            fi
            for f in usr/bin/sing-box; do
              if [[ -e "$tmpd/rootfs/$f" ]]; then
                echo "::error::rootfs 里出现了 /$f —— 代理栈没换干净"
                bad=$((bad + 1))
              fi
            done
            rm -rf "$tmpd"
            [[ "$bad" -eq 0 ]] || { echo "::error::出厂文件核对失败（$bad 项）"; exit 1; }
            echo "::notice title=出厂文件::daed 主程序 + /etc/config/daed + init + LuCI 菜单/ACL + geo 软链都在"
          fi

      - name: 上传镜像（artifact）
        # 用 always()：即使后面某一步（比如功能包校验）失败，产物也必须传上去。
        # 否则一旦校验报错，连固件本身都拿不到了 —— 老 homeproxy 线 run #6 就吃了
        # 这个亏：校验误报 → 这一步被 skip → artifact 总数为 0。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ env.DEVICE }}-imm-nss-daed-${{ github.run_number }}
          path: |
            openwrt/bin/targets/qualcommax/ipq807x/*qnap_301w*
            openwrt/bin/targets/qualcommax/ipq807x/*.manifest
            openwrt/bin/targets/qualcommax/ipq807x/sha256sums
            openwrt/bin/targets/qualcommax/ipq807x/config.buildinfo
            openwrt/bin/targets/qualcommax/ipq807x/profiles.json
          if-no-files-found: warn
          retention-days: 30

      # ── 可选：发 Release ──────────────────────────────────────
      # 版本取自 rootfs 清单（*.manifest，每行 "<包> - <版本>"）—— 固件里**实际
      # 装进去**的版本，比读配方文件可靠（配方版本 ≠ 最终包版本）。
      - name: 生成 Release 说明（编译日期 / 各组件版本）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        run: |
          set -uo pipefail
          out="openwrt/bin/targets/${TARGET}/${SUBTARGET}"
          manifest=$(find "$out" -maxdepth 1 -name '*.manifest' -print -quit 2>/dev/null || true)

          # 取版本；没收录（本版没编进去）就如实写"未收录"，不编数字
          ver_of() {
            local v=""
            if [[ -n "$manifest" ]]; then
              v="$(sed -n "s/^$1[[:space:]]\+-[[:space:]]\+//p" "$manifest" | head -n1)"
            fi
            printf '%s' "${v:-未收录}"
          }

          DATE_UTC="$(date -u '+%Y-%m-%d %H:%M UTC')"
          DATE_CN="$(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')"
          BASE_COMMIT="$(git -C openwrt log -1 --format='%h · %cs' 2>/dev/null || echo '?')"
          OW_VER="$(sed -n 's/^RELEASE:=//p' openwrt/include/version.mk 2>/dev/null | head -n1)"

          PKGS="daed luci-app-daed daed-geoip daed-geosite v2ray-geoip v2ray-geosite \
                kmod-sched-core kmod-sched-bpf kmod-veth kmod-xdp-sockets-diag \
                msd_lite luci-app-msd_lite ddns-go luci-app-ddns-go \
                wireguard-tools luci-proto-wireguard \
                luci-app-statistics collectd-mod-thermal rrdtool1 autocore \
                nss-tools luci-app-nss nssqos luci-app-nssqos \
                kmod-qca-nss-drv kmod-qca-nss-ecm kmod-qca-ppe-nss"

          {
            printf '# QHora-301W · ImmortalWrt + NSS 固件（daed 版）\n\n'
            printf '| | |\n|---|---|\n'
            printf '| **编译日期** | %s（北京时间 %s） |\n' "$DATE_UTC" "$DATE_CN"
            printf '| **基座源码** | `%s` @ `%s`，提交 `%s` |\n' "$IMM_REPOSITORY" "$IMM_BASE_REF" "$BASE_COMMIT"
            printf '| **NSS 支持** | `patches/immortalwrt-nss/`（补丁，来源见该目录 README） |\n'
            printf '| **OpenWrt** | %s |\n' "${OW_VER:-未知}"
            printf '| **代理栈** | daed（eBPF 内核态分流；`luci-app-daed` 管理） |\n'
            printf '| **构建配方** | `kunude/qhora-301w-build` @ `%s`，run #%s |\n\n' "${{ github.sha }}" "${{ github.run_number }}"

            printf '## 组件版本（取自固件 rootfs 清单）\n\n'
            printf '| 组件 | 版本 |\n|---|---|\n'
            for p in $PKGS; do printf '| `%s` | %s |\n' "$p" "$(ver_of "$p")"; done
            printf '\n'
            printf '> 本线的内核**已打开 BTF**（`CONFIG_DEBUG_INFO_BTF=y`，并关掉\n'
            printf '> `DEBUG_INFO_REDUCED`）—— 这是 daed 的 CO-RE 硬前提。构建期会直接\n'
            printf '> 从 vmlinux 里把 `.BTF` 段抓出来验大小，验不过就不出固件。\n'
            printf '> 老五条线的内核**没有** BTF，daed 装上去也起不来，别混刷。\n\n'

            cat <<'MD'
          ## 文件

          | 文件 | 用途 |
          |---|---|
          | `*-initramfs-uImage.itb` | **首次安装**：U-Boot 里用 TFTP 引导，再 sysupgrade |
          | `*-squashfs-sysupgrade.bin` | 日常升级（已在跑 OpenWrt 时） |
          | `*-squashfs-factory.bin` | eMMC 整盘写入 |

          刷机前先用 `sha256sums` 校验。默认 LAN `192.168.35.1`，NSS 硬件卸载开机自启
          （`nss-status` 查看状态）。出厂已配好分流 / DNS / 订阅开关，**只需填节点或订阅链接**。

          > ⚠️ 本固件不含 passwall2，也不含 sing-box / HomeProxy：daed 在**内核态**
          > 用 eBPF 分流，不起用户态代理进程、不劫持 dnsmasq、不需要 nft tproxy。
          > 要 passwall2 / HomeProxy 版请用另外两条 imm 线。

          ## 用之前先做三件事

          1. **登录面板**：`http://192.168.35.1:2023`（端口以 `/etc/config/daed` 的
             `listen` 为准），账号 `admin`，口令见构建时传入的 `DAED_ADMIN_PASS`
             （没传就是仓库脚本里的默认值）。**首登请改口令。**
          2. **加订阅**：面板里填机场订阅链接，拉出节点后把订阅（或节点）加进
             那个唯一的 `proxy` 组，然后点「启动」。
             出厂已经配好 global / dns / routing 三段（`domain++`、`br-lan`、
             CN 直连、广告拦截、禁 QUIC、其余走 `proxy`），不用再动。
          3. **改 root 密码**：出厂 SSH 密码是 `password`（首启自动写入，
             解决"空密码 + PermitEmptyPasswords=no ⇒ SSH 永远登不进去"）。
             刷完第一件事就是 `passwd root`。LuCI 里加的公钥现在真的生效了
             （`/etc/dropbear/authorized_keys` 已软链到 `/root/.ssh/authorized_keys`）。

          > 💡 连回家（WireGuard 服务端）要走代理的话，得在面板的 global 里把隧道
          > 那张网卡加进 `lan_interface`（`br-lan, <隧道网卡>`）——只有列进去的接口
          > 流量才进 eBPF；反过来，写进去的接口必须一直存在，删了 daed 会起不来。

          > ⚠️ 本固件与前两条线（nss-edma fork 基座）**不是同一个基座**：内核、驱动、DTS
          > 都来自 ImmortalWrt。刷机方式与产物结构一致，但不要在两边的固件之间来回
          > 只刷 sysupgrade 而不看版本——基座不同，建议保留一份可回退的镜像。
          MD
          } > "$GITHUB_WORKSPACE/release-notes.md"

          echo "已生成 release-notes.md（$(wc -l < "$GITHUB_WORKSPACE/release-notes.md") 行）"

      - name: 计算 Release 标签
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        id: tag
        run: echo "tag=qhora-301w-imm-nss-daed-$(date -u +%Y%m%d)-${{ github.run_number }}" >>"$GITHUB_OUTPUT"

      - name: 创建 Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: QHora-301W ImmortalWrt + NSS (daed) ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          body_path: release-notes.md
          files: |
            openwrt/bin/targets/qualcommax/ipq807x/*qnap_301w*
