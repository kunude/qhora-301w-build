name: _build

# 两条线的共用实现。由 build-immortalwrt.yml / build-openwrt-nss.yml 通过
# `uses:` 调用，不手动触发（workflow_dispatch 故意不开）。
#
# 为什么合成一个 workflow_call 而不是两份复制的 yml：
# 编译、缓存、产物校验、发 Release 这些步骤和「哪条线」无关，
# 拆成两份以后任何一处修正都要改两遍，而漏改的那个不会报错 ——
# 它只是继续用旧逻辑，安静地出固件。差异只有三个：源码树、distro 标签、
# NSS 的落法，全部由调用方通过 inputs 传进来。

on:
  workflow_call:
    inputs:
      flavor:
        description: '产物名里的线标识（imm / nss）'
        type: string
        required: true
      distro:
        description: '发行版：immortalwrt / openwrt（决定 prepare.sh 的符号层）'
        type: string
        required: true
      nss:
        description: 'NSS：1=开（按树自动选整树/移植），0=关'
        type: string
        required: true
      source_repo:
        description: '基座源码仓库'
        type: string
        required: true
      source_ref:
        description: '基座 ref（分支 / tag / sha）'
        type: string
        required: true
      nss_wifi_ref:
        description: '移植 NSS 组件时从 ppe-nss 的哪个 ref 取'
        type: string
        default: 'ppe-nss'
      proxy:
        type: string
        required: true
      singbox_mode:
        type: string
        default: 'builtin'
      extra_packages:
        type: string
        default: ''
      release:
        type: boolean
        default: false
      clean_build:
        type: boolean
        default: false

permissions:
  contents: write

env:
  TARGET: qualcommax
  SUBTARGET: ipq807x
  DEVICE: qnap_301w
  DEVICE_LABEL: QHora-301W
  OPENWRT_DIR: ${{ github.workspace }}/openwrt
  BUILDER_DIR: ${{ github.workspace }}/builder

jobs:
  build:
    name: ${{ inputs.flavor }} · ${{ inputs.proxy }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      # prepare.sh 读 NSS / DISTRO，它自己再决定「整树」还是「移植」。
      NSS: ${{ inputs.nss }}
      DISTRO: ${{ inputs.distro }}
      PROXY_STACK: ${{ inputs.proxy }}
      SINGBOX_MODE: ${{ inputs.singbox_mode }}
      EXTRA_PACKAGES: ${{ inputs.extra_packages }}
      NSS_WIFI_REF: ${{ inputs.nss_wifi_ref }}
      # prepare 阶段的几个脚本都要查 GitHub API（版本解析 / honk 的构建元数据）。
      # 不传 token 走的是匿名限额（60 次/小时/IP，runner 是共享 IP）。
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: 释放磁盘空间
        # 全量编译约需 25-35GB，runner 根分区默认不够。
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h / | tail -1

      - name: 安装构建依赖
        run: |
          set -euo pipefail
          # OpenWrt 自建 flex/bison 等 host 工具，宿主机只需最小集合。
          sudo apt-get update || true
          sudo apt-get install -y \
            bzip2 g++ gawk gcc git glibc-source libncurses-dev make patch python3 rsync

      - name: 检出基座源码
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          path: openwrt

      - name: 检出本仓库（配置与脚本）
        uses: actions/checkout@v7
        with:
          path: builder

      - name: 环境预检
        run: |
          set -euo pipefail
          for c in perl make git gcc g++ gawk bzip2 curl tar sha256sum patch python3 rsync; do
            command -v "$c" >/dev/null 2>&1 ||
              { echo "::error::runner 上缺少必需工具：$c"; exit 1; }
          done
          perl -v | sed -n '2p'
          make --version | head -1
          echo "树：$(git -C openwrt log -1 --format='%h %s')"

      - name: 准备构建环境（feeds + .config + 覆盖文件）
        # 三种 NSS 落法（关 / 整树 / 移植）全在脚本里判断，这里只传参数。
        # 移植线会在这一步把 ppe-nss 的驱动与补丁搬进树，并核对 backports 基线。
        id: prepare
        run: |
          set -o pipefail
          bash "$BUILDER_DIR/scripts/prepare.sh" 2>&1 | tee "$RUNNER_TEMP/prepare.log"

      - name: 回放构建准备日志
        if: always() && steps.prepare.outcome != 'skipped'
        run: |
          if [[ -s "$RUNNER_TEMP/prepare.log" ]]; then
            tail -80 "$RUNNER_TEMP/prepare.log"
          else
            echo "没有准备阶段日志"
          fi

      - name: 设置可复现构建环境变量
        working-directory: openwrt
        run: |
          set -euo pipefail
          git log -1 --format='  base commit : %H %ci%n  subject     : %s'
          {
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
            echo "TZ=UTC"
            echo "LC_ALL=C"
            echo "KBUILD_BUILD_USER=builder"
            echo "KBUILD_BUILD_HOST=github-actions"
          } >>"$GITHUB_ENV"

      # ── 源码包缓存 ────────────────────────────────────────────
      # key 里带线标识和代理栈：各线的包集合不同，混用只会互相顶掉。
      - name: 恢复源码包缓存
        if: inputs.clean_build == false
        uses: actions/cache/restore@v6
        with:
          path: openwrt/dl
          key: dl-${{ inputs.flavor }}-${{ inputs.proxy }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dl-${{ inputs.flavor }}-${{ inputs.proxy }}-
            dl-${{ inputs.flavor }}-

      - name: 下载源码包
        id: download
        working-directory: openwrt
        run: |
          set -euo pipefail
          mkdir -p dl
          before=$(find dl -maxdepth 1 -type f | wc -l)
          for attempt in 1 2 3; do
            if make download -j"$(nproc)"; then break; fi
            if [[ $attempt -ge 3 ]]; then echo "::error::源码包下载连续失败三次"; exit 1; fi
            echo "::warning::第 $attempt 次下载失败，重试"
            sleep 10
          done
          if [[ "$(find dl -maxdepth 1 -type f | wc -l)" -gt "$before" ]]; then
            echo "grew=true" >>"$GITHUB_OUTPUT"
          else
            echo "grew=false" >>"$GITHUB_OUTPUT"
          fi

      - name: 保存源码包缓存
        if: steps.download.outputs.grew == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: openwrt/dl
          key: dl-${{ inputs.flavor }}-${{ inputs.proxy }}-${{ github.run_id }}-${{ github.run_attempt }}

      # ── ccache ────────────────────────────────────────────────
      # key 带上工具链目录树哈希 + 工具链配置：任一项变了就从空缓存开始。
      - name: 计算 ccache key
        id: ccache
        run: |
          set -euo pipefail
          tree=$(git -C openwrt rev-parse HEAD:toolchain)
          sum=$({
            echo "$tree"
            grep -E '^CONFIG_(BINUTILS|GCC|LIBC|MUSL|GLIBC)_' openwrt/.config
            gcc --version; as --version
          } | sha256sum | cut -c1-16)
          echo "prefix=ccache-qhora301w-${{ inputs.flavor }}-${{ inputs.proxy }}-$sum-" >>"$GITHUB_OUTPUT"

      - name: 恢复 ccache
        if: inputs.clean_build == false
        uses: actions/cache@v6
        with:
          path: openwrt/.ccache
          key: ${{ steps.ccache.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.ccache.outputs.prefix }}

      # ── 编译 ──────────────────────────────────────────────────
      - name: 编译
        working-directory: openwrt
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 5G
          BUILD_LOG: ${{ runner.temp }}/build.log
        run: |
          # 故意不加 -e：make 失败要自己接住，好决定是否单线程重跑。
          set -uo pipefail
          : >"$BUILD_LOG"
          make -j"$(nproc)" 2>&1 | tee -a "$BUILD_LOG"
          rc=${PIPESTATUS[0]}
          if (( rc != 0 )); then
            echo "::warning::并行编译失败（make 退出码 $rc），改用单线程 -j1 V=s 重跑以拿到完整报错"
            make -j1 V=s 2>&1 | tee -a "$BUILD_LOG"
            rc=${PIPESTATUS[0]}
          fi
          staging_dir/host/bin/ccache -s 2>&1 | tee -a "$BUILD_LOG" || true
          if (( rc != 0 )); then
            echo "编译失败：make 最终退出码 $rc。完整日志见下一步「回放编译日志」。"
            exit "$rc"
          fi
          echo "编译通过"

      - name: 回放编译日志
        if: always()
        env:
          BUILD_LOG: ${{ runner.temp }}/build.log
        run: |
          if [[ ! -s "$BUILD_LOG" ]]; then
            echo "没有构建日志（可能编译步骤之前就失败了）"
            exit 0
          fi
          # 作业日志要 admin 权限才能从 API 取，注解是公开可读的。
          grep -nE '(\*\*\* \[.*\] Error|ERROR: |error: |No rule to make target)' "$BUILD_LOG" |
            tail -20 | while IFS= read -r line; do
              echo "::error title=编译报错::$line"
            done || true
          tail -40 "$BUILD_LOG"

      - name: 收集并校验产物
        run: |
          set -euo pipefail
          out="openwrt/bin/targets/${TARGET}/${SUBTARGET}"
          [[ -d "$out" ]] || { echo "::error::输出目录不存在：$out"; exit 1; }
          ls -lh "$out"

          compgen -G "$out/*${DEVICE}*squashfs-sysupgrade.bin" >/dev/null ||
            { echo "::error::$out 下没有 ${DEVICE} 的 sysupgrade 镜像"; exit 1; }

          if listing=$(cd "$out" && ls -lh . 2>/dev/null |
                         grep -E "${DEVICE}|sha256sums|config\.buildinfo|profiles\.json|\.manifest|\.bom\.cdx\.json" |
                         awk '{print $5"  "$9}'); then
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              echo "::notice title=${DEVICE_LABEL} 产物::$line"
            done <<<"$listing"
          fi

          {
            echo "## ${DEVICE_LABEL} 构建产物"
            echo
            echo "- 线：\`${{ inputs.flavor }}\` · 源码：\`$(git -C openwrt remote get-url origin)\` @ \`$(git -C openwrt rev-parse --short HEAD)\`"
            if [[ "$NSS" == "1" ]]; then
              echo "- NSS：集成（Wi-Fi 卸载 + 有线加速）"
            else
              echo "- NSS：不集成"
            fi
            echo "- 代理栈：\`${PROXY_STACK}\` / sing-box：\`${SINGBOX_MODE}\`"
            echo
            echo '```'
            (cd "$out" && ls -lh . | grep -E "${DEVICE}|sha256sums|config\.buildinfo|profiles\.json|\.manifest" || true)
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # ── 功能包是否真的进了固件 ────────────────────────────────
      # .config 里写 =y 只证明"被选中"，不证明"编出来了"。三个角度互相独立：
      #   ① 包文件（apk 后端 .apk / opkg 后端 .ipk）
      #   ② rootfs 的 .manifest —— 最终固件里实际装了什么
      #   ③ 内核 BTF —— daed/dae/honk 的 CO-RE 前提（只有这三条线要查）
      - name: 校验功能包是否真的编进固件
        run: |
          set -euo pipefail
          out="openwrt/bin/targets/${TARGET}/${SUBTARGET}"
          WANT="$(DISTRO="$DISTRO" NSS="$NSS" PROXY_STACK="$PROXY_STACK" \
                  EXTRA_PACKAGES="$EXTRA_PACKAGES" bash "$BUILDER_DIR/scripts/wanted-packages.sh")"
          echo "本变体要求 $(wc -w <<<"$WANT") 个功能包"

          manifest=$(find "$out" -maxdepth 1 -name '*.manifest' -print -quit 2>/dev/null || true)
          if [[ -n "$manifest" ]]; then
            echo "::notice title=rootfs 清单::$(basename "$manifest") —— $(wc -l < "$manifest") 行"
          else
            echo "::warning::$out 下没有 .manifest，只能核对包文件"
          fi

          bad=0
          for p in $WANT; do
            pkg=$(find openwrt/bin/packages openwrt/bin/targets \
                    \( -name "${p}-*.apk" -o -name "${p}_*.ipk" \) \
                    -print -quit 2>/dev/null || true)
            hit=0
            if [[ -n "$manifest" ]] && grep -qE "^${p}[[:space:]]" "$manifest"; then hit=1; fi

            if [[ -n "$pkg" && "$hit" -eq 1 ]]; then
              echo "::notice title=功能包 OK::$p → $(basename "$pkg")"
            elif [[ -n "$pkg" ]]; then
              echo "::warning::$p 编出来了（$(basename "$pkg")）但不在 rootfs 清单里"
            else
              echo "::error::$p 既没有包文件也不在 rootfs 清单里 —— 它没有被编译"
              bad=$((bad + 1))
            fi
          done

          # BTF：daed / dae / honk 的 eBPF 程序靠 CO-RE 读内核结构，没有 .BTF 段
          # 一启动就失败。.config 里开了 DEBUG_INFO 也可能被
          # KERNEL_DEBUG_INFO_REDUCED 挡掉，所以必须查编出来的内核本体。
          case "$PROXY_STACK" in
            daed|dae|honk)
              vmlinux=$(find openwrt/build_dir -maxdepth 4 -name vmlinux -print -quit 2>/dev/null || true)
              if [[ -n "$vmlinux" ]] && readelf -S "$vmlinux" 2>/dev/null | grep -q '\.BTF'; then
                echo "::notice title=BTF::内核含 .BTF 段，$PROXY_STACK 的 CO-RE 前提满足"
              else
                echo "::error::$PROXY_STACK 需要内核 BTF，但 vmlinux 里没有 .BTF 段"
                bad=$((bad + 1))
              fi
              ;;
          esac

          [[ "$bad" -eq 0 ]] || { echo "::error::有 $bad 项校验未通过"; exit 1; }
          echo "功能包与内核前提全部通过"

      # ── 出厂预置是否真的进了镜像 ──────────────────────────────
      # 覆盖层是**静默合并**的：`cp -a files-<栈>/. files/` 对不存在的目录
      # 直接跳过，目录名拼错、被 .gitignore 吃掉都不报错。编出来的固件照样
      # 能刷能开机，只是打开配置页面是空的 —— 只有刷完机才发现。
      # 这一步按覆盖层逐个文件核对拼镜像之前的 root-*：存在性、逐字节内容、
      # 以及那几条「权限即功能」的期望值。
      - name: 校验出厂预置是否进了镜像
        run: bash "$BUILDER_DIR/scripts/verify-presets.sh" --tree openwrt

      - name: 上传镜像（artifact）
        # always()：校验失败也要能拿到固件，否则白编两小时。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qhora-301w-${{ inputs.flavor }}-${{ inputs.proxy }}-${{ github.run_number }}
          path: |
            openwrt/bin/targets/qualcommax/ipq807x/*qnap_301w*
            openwrt/bin/targets/qualcommax/ipq807x/*.manifest
            openwrt/bin/targets/qualcommax/ipq807x/sha256sums
            openwrt/bin/targets/qualcommax/ipq807x/config.buildinfo
            openwrt/bin/targets/qualcommax/ipq807x/profiles.json
          if-no-files-found: warn
          retention-days: 30

      # ── 可选：发 Release ──────────────────────────────────────
      # tag 必须提前算成 output：`with:` 里的值只做表达式求值，
      # 写 $(date ...) 不会被 shell 执行，会变成字面量。
      - name: 计算 Release 标签
        if: inputs.release
        id: tag
        run: |
          echo "tag=qhora-301w-${{ inputs.flavor }}-${PROXY_STACK}-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}" >>"$GITHUB_OUTPUT"

      - name: 生成 Release 说明
        if: inputs.release
        run: |
          set -uo pipefail
          out="openwrt/bin/targets/${TARGET}/${SUBTARGET}"
          manifest=$(find "$out" -maxdepth 1 -name '*.manifest' -print -quit 2>/dev/null || true)
          ver_of() {
            local v=""
            if [[ -n "$manifest" ]]; then
              v="$(sed -n "s/^$1[[:space:]]\+-[[:space:]]\+//p" "$manifest" | head -n1)"
            fi
            printf '%s' "${v:-未收录}"
          }
          DATE_CN="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          UP_COMMIT="$(git -C openwrt log -1 --format='%h · %cs' 2>/dev/null || echo '?')"
          OW_VER="$(sed -n 's/^RELEASE:=//p' openwrt/include/version.mk 2>/dev/null | head -n1)"
          if [[ "$NSS" == "1" ]]; then
            NSS_ROW='集成（Wi-Fi 卸载 + 有线加速）'
          else
            NSS_ROW='不集成'
          fi

          {
            printf '# QHora-301W · %s 固件\n\n' "$DISTRO"
            printf '| | |\n|---|---|\n'
            printf '| **编译时间** | %s（北京时间） |\n' "$DATE_CN"
            printf '| **发行版** | `%s` |\n' "$DISTRO"
            printf '| **NSS** | %s |\n' "$NSS_ROW"
            printf '| **代理栈** | `%s` |\n' "$PROXY_STACK"
            printf '| **源码** | `%s` @ `%s` |\n' "$(git -C openwrt remote get-url origin)" "$UP_COMMIT"
            printf '| **OpenWrt** | %s |\n\n' "${OW_VER:-未知}"
            printf '## 组件版本（取自固件 rootfs 清单）\n\n| 组件 | 版本 |\n|---|---|\n'
            for p in $(DISTRO="$DISTRO" NSS="$NSS" PROXY_STACK="$PROXY_STACK" \
                       bash "$BUILDER_DIR/scripts/wanted-packages.sh"); do
              printf '| `%s` | %s |\n' "$p" "$(ver_of "$p")"
            done
            printf '\n## 文件\n\n'
            printf '| 文件 | 用途 |\n|---|---|\n'
            printf '| `*-initramfs-uImage.itb` | 首次安装：U-Boot 里 TFTP 引导 |\n'
            printf '| `*-squashfs-sysupgrade.bin` | 日常升级 |\n\n'
            printf '刷机前用 `sha256sums` 校验。默认 LAN `192.168.35.1`。\n'
          } > release-notes.md

      - name: 创建 Release
        if: inputs.release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: QHora-301W ${{ inputs.flavor }} ${{ inputs.proxy }} #${{ github.run_number }}
          draft: false
          prerelease: false
          body_path: release-notes.md
          files: |
            openwrt/bin/targets/qualcommax/ipq807x/*qnap_301w*
