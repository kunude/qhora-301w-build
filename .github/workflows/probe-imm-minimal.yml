name: Probe · ImmortalWrt 最小构建

# 目的：把「imm 主树 + 我们需要的包」单独拿出来编一次，判断编译失败来自
# 上游主树，还是来自本仓库的加工层。这是一次对照实验，不是正式构建线。
#
# 明确不做的事（对照 _build.yml / scripts/prepare-build.sh）：
#   × 不调用本仓库任何脚本（prepare.sh / prepare-build.sh / extra-packages.sh …）
#   × 不叠 configs/*.config —— .config 由本文件现场生成，只有 target/device + 包
#   × 不复制 files*/ 覆盖、不注入 patches/kernel/、不改任何 .mk
#   × 不追加第三方 feed（feeds.conf 用主树自带默认那份）
#   × 不集成 NSS、不移植 nss-wifi、不加 nss feed
#   × 不用 ccache / dl 缓存、不设 SOURCE_DATE_EPOCH 之类的环境变量
# 写进源码树的只有 .config 一个文件；checkout 本仓库这一步都不需要。
#
# 为什么「集成包」可以不动树：ddns-go / msd_lite / luci-app-ddns-go /
# luci-app-msd_lite 本来就在 ImmortalWrt 官方 packages / luci feed 里，
# wireguard-tools / kmod-wireguard 在主树里。只要把包名写进 .config，
# feeds install -a 会负责接管，不需要本仓库那套自带配方与稀疏检出。
#
# 判据：
#   · imm_ref=master 且红在 firewall4 的 .prepared → 主树自带问题，与我们无关
#   · 同一个 ref 但红在别的包 → 我们的包 / 集成方式有问题
#   · d42cc475c 是 2026-11-14「Merge Official Source」之前最后一个好快照，
#     仍可作为干净对照：当时 firewall4 源码是旧版，fullcone 补丁的 hunk 对得上
#
# 2026-11-16 更新：上游已用 2fe3065ade "firewall4: refresh fullcone patches"
# 修掉这次冲突 —— 官方把 firewall4 升到 2026-11-08 后，root/etc/config/firewall
# 在 config defaults 下多了 option syn_flood，并删掉了两行 disable_ipv6 注释，
# 旧补丁的 hunk 上下文因此失效（1 out of 1 hunk FAILED）。现在 master 应能编过；
# 若又红在同一处，先跑这个 probe 判断是哪一侧发生了版本漂移。
#
# 触发（先 push 到默认分支）：
#   gh workflow run probe-imm-minimal.yml -f imm_ref=master
#   gh workflow run probe-imm-minimal.yml -f imm_ref=d42cc475c

on:
  workflow_dispatch:
    inputs:
      imm_ref:
        description: 'immortalwrt 基座 ref（master 看真实状态；d42cc475c 做干净对照）'
        type: string
        default: 'master'

      packages:
        description: '要勾选的包，逗号分隔（必须是 imm 主树或官方 feed 里有的包名）'
        type: string
        default: 'ddns-go,msd_lite,luci-app-ddns-go,luci-app-msd_lite,wireguard-tools,luci-proto-wireguard,kmod-wireguard,qrencode,luci'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # runner 只有约 14G 可用，整树编译需要 ~30G。不清理会满盘，
      # 症状是「包级 failed to build 但没有编译错误」，会污染实验结论。
      - name: 释放磁盘空间
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android \
            /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/az /usr/share/miniconda \
            /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/go /usr/lib/jvm || true
          sudo apt-get clean
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: 安装构建依赖
        run: |
          set -euo pipefail
          sudo apt-get update || true
          sudo apt-get install -y \
            bzip2 file flex bison g++ gawk gcc gettext git libelf-dev libncurses-dev \
            libssl-dev make patch perl python3 python3-setuptools rsync unzip wget \
            zlib1g-dev zstd

      - name: 检出 immortalwrt 主树
        uses: actions/checkout@v7
        with:
          repository: immortalwrt/immortalwrt
          ref: ${{ inputs.imm_ref }}
          fetch-depth: 1
          path: openwrt

      - name: 记录基线
        working-directory: openwrt
        env:
          IMM_REF: ${{ inputs.imm_ref }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          {
            echo "## 最小构建基线"
            echo
            echo "- 基座：\`immortalwrt/immortalwrt\` @ \`$IMM_REF\`"
            echo "- 实际 commit：\`$(git log -1 --format='%H %ci %s')\`"
            echo "- 请求包：\`$PACKAGES\`"
          } >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='%H %ci %s'

      - name: 生成最小 .config
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          {
            echo 'CONFIG_TARGET_qualcommax=y'
            echo 'CONFIG_TARGET_qualcommax_ipq807x=y'
            echo 'CONFIG_TARGET_MULTI_PROFILE=y'
            echo 'CONFIG_TARGET_PER_DEVICE_ROOTFS=y'
            echo 'CONFIG_TARGET_DEVICE_qualcommax_ipq807x_DEVICE_qnap_301w=y'
            echo 'CONFIG_TARGET_ROOTFS_SQUASHFS=y'
          } > openwrt/.config
          IFS=',' read -ra pkgs <<< "$PACKAGES"
          for p in "${pkgs[@]}"; do
            p="$(printf '%s' "$p" | tr -d '[:space:]')"
            [[ -n "$p" ]] || continue
            [[ "$p" =~ ^[A-Za-z0-9_.+-]+$ ]] || { echo "::error::非法包名：$p"; exit 1; }
            echo "CONFIG_PACKAGE_${p}=y" >> openwrt/.config
          done
          echo "--- 请求阶段的 .config ---"
          cat openwrt/.config

      - name: 初始化官方 feed
        working-directory: openwrt
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: defconfig 并核对包符号
        env:
          PACKAGES: ${{ inputs.packages }}
        working-directory: openwrt
        run: |
          set -euo pipefail
          make defconfig
          IFS=',' read -ra pkgs <<< "$PACKAGES"
          bad=0
          for p in "${pkgs[@]}"; do
            p="$(printf '%s' "$p" | tr -d '[:space:]')"
            [[ -n "$p" ]] || continue
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "OK  $p"
            else
              echo "::error::$p 被 defconfig 丢弃（主树/官方 feed 里没有这个包，或依赖不满足）"
              bad=$((bad + 1))
            fi
          done
          [[ "$bad" -eq 0 ]] || { echo "共 $bad 个包没有被选中"; exit 1; }
          echo "--- 生效的 target / device ---"
          grep -E '^CONFIG_TARGET_(qualcommax|DEVICE_|MULTI_PROFILE)' .config

      - name: 下载源码包
        working-directory: openwrt
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            make download -j"$(nproc)" && exit 0
            echo "::warning::download 第 $i 次失败，重试"
          done
          exit 1

      - name: 编译
        working-directory: openwrt
        run: |
          set +e
          set -uo pipefail
          : > "$RUNNER_TEMP/build.log"
          # V=s：包级输出直接进日志，避免只看到「failed to build」却没有原因
          make -j"$(nproc)" V=s 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          rc=${PIPESTATUS[0]}
          echo "make 退出码：$rc"
          exit "$rc"

      - name: 失败现场
        if: failure()
        run: |
          log="$RUNNER_TEMP/build.log"
          df -h / || true
          if [[ -s "$log" ]]; then
            # 模式里特意包含 patch 失败：上一轮 #26 就是因为漏了它，
            # 公开注解里只剩 make 的 Error 1，看不到真正原因。
            grep -nE '(Patch failed|hunk .*FAILED|patch does not apply|can.t find file to patch|ERROR: .* failed to build|\*\*\* \[.*\] Error|No space left on device|Killed|fatal error:|No rule to make target|Error [0-9]+$)' "$log" \
              | tail -40 | while IFS= read -r line; do echo "::error::$line"; done || true
            echo "--- build.log 末尾 ---"
            tail -60 "$log"
          else
            echo "没有编译日志（编译步骤之前就失败了）"
          fi

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-imm-minimal-log-${{ github.run_number }}
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
