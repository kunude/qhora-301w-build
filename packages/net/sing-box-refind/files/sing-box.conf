# sing-box 的 UCI 配置（源码编译版）
#
# 与本文件配套的还有 /etc/sing-box/config.json —— 那才是 sing-box 真正读的
# 配置文件，这里只管"启不启动、用哪份配置、工作目录在哪"。
#
# 日志走 procd 的 stdout/stderr（即 logread），不在 UCI 里另配文件轮转：
# sing-box 自己的 log 配置在 config.json 的 "log" 段里，两处都配只会互相矛盾。
#
# ⚠️ 本包在 HomeProxy 线（build-...-homeproxy-refind）里**不会被启用**：
#    那条线由 /etc/init.d/homeproxy 生成自己的配置并直接拉起 sing-box，
#    与本 init 脚本互不干扰（两个 init 名字不同，也不会抢同一个进程）。
#    只有纯净内核线（build-...-singbox-src）才把它设成 enabled=1。

config sing-box 'main'
	option enabled '0'
	option conffile '/etc/sing-box/config.json'
	option workdir '/etc/sing-box'
